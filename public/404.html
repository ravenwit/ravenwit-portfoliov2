<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    const path = window.location.pathname;
    if (path.includes('/qucontext')) {
      window.location.replace('/qucontext/');
    } else {
      window.location.replace('/');
    }
  </script>
</head>
<body>
</body>
</html>
