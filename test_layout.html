<!DOCTYPE html>
<html>
<head>
<style>
    body { background: #333; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
    .ising-right-panel {
        display: flex;
        flex-direction: column;
        gap: 40px;
    }
    .telemetry-card {
        background: rgba(15, 15, 15, 0.85);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 16px;
        padding: 24px;
        box-sizing: border-box;
        width: 348px;
        max-width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        gap: 16px;
    }
    .telemetry-label {
        font-family: monospace;
        font-size: 11px;
        color: #aaa;
        text-transform: uppercase;
        letter-spacing: 1px;
        align-self: flex-start;
        margin: 0;
    }
    canvas {
        background: #111; /* to see the canvas bounds */
    }
</style>
</head>
<body>
    <div class="ising-right-panel">
        <div class="telemetry-card">
            <span class="telemetry-label">Energy Thermalization</span>
            <canvas id="ising-energy-graph" width="600" height="400" style="width: 100%; max-width: 300px; aspect-ratio: 3 / 2; display: block; border-radius: 4px;"></canvas>
        </div>
        <div class="telemetry-card">
            <span class="telemetry-label">Autocorrelation C(τ)</span>
            <canvas id="ising-acf-graph" width="600" height="400" style="width: 100%; max-width: 300px; aspect-ratio: 3 / 2; display: block; border-radius: 4px;"></canvas>
        </div>
    </div>
</body>
</html>
